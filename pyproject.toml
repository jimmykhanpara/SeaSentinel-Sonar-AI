[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-debris"
version = "1.0.0"
description = "AI-Powered Ghost Net & Marine Debris Detection System for Side Scan Sonar"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "onnxruntime>=1.15.0",
    "scikit-learn>=1.2.0",
    "shapely>=2.0.0",
    "matplotlib>=3.7.0",
    "python-multipart>=0.0.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sonar_debris*"]
